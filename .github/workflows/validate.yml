name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python tools/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/gac.py validate --graph examples/graph.json
      - run: python scripts/gac.py render --graph examples/graph.json --out /tmp/graph.mmd
      - if: matrix.python-version == '3.12'
        run: python tools/package_skill.py --out dist/skill.zip
